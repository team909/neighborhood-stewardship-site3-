<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" fill="#F5EDDF"/>
  <rect x="32" y="27" width="1536" height="819" rx="32" fill="url(#paper)" stroke="#D8C8AF"/>
  <rect x="88" y="72" width="1424" height="648" rx="25" fill="url(#wash)"/>
  <ellipse cx="800" cy="774" rx="544" ry="41" fill="#DCC8AB" fill-opacity=".42"/>
  
    <rect x="116" y="116" width="1368" height="272" rx="24" fill="#213127"/>
    <g filter="url(#shadow)">
      <rect x="296" y="194" width="280" height="426" rx="24" fill="#314135"/>
      <rect x="610" y="146" width="380" height="474" rx="24" fill="#223328"/>
      <rect x="1024" y="194" width="280" height="426" rx="24" fill="#314135"/>
      <rect x="744" y="290" width="110" height="210" rx="16" fill="#F6DEA2" opacity=".88"/>
      <circle cx="466" cy="426" r="58" fill="#F4D79A" opacity=".86"/>
      <circle cx="1134" cy="426" r="58" fill="#F4D79A" opacity=".86"/>
      <ellipse cx="802" cy="632" rx="520" ry="34" fill="#C9B293" fill-opacity=".24"/>
    </g>
  <text x="800" y="761" text-anchor="middle" fill="#947450" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">GALLERY</text>
  <text x="800" y="815" text-anchor="middle" fill="#223327" font-family="Georgia, serif" font-size="50">Porch Glow</text>
  <text x="800" y="851" text-anchor="middle" fill="#5F715C" font-family="Arial, sans-serif" font-size="25">The evening little glow that makes the front look loved.</text>
  <defs>
    <linearGradient id="paper" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#EEE2D0"/>
    </linearGradient>
    <linearGradient id="wash" x1="800" y1="72" x2="800" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F2E9"/>
      <stop offset="0.58" stop-color="#F0E5D6"/>
      <stop offset="1" stop-color="#E6D5BD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 180) rotate(90) scale(162 560)">
      <stop stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#FFF7E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#8B7254" flood-opacity=".16"/>
    </filter>
  </defs>
</svg>