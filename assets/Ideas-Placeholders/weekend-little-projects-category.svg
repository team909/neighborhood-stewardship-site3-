  <text x="600" y="761" text-anchor="middle" fill="#947450" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">COMING SOON</text>
  <text x="600" y="815" text-anchor="middle" fill="#223327" font-family="Georgia, serif" font-size="50">Weekend Little Projects</text>
  <text x="600" y="851" text-anchor="middle" fill="#5F715C" font-family="Arial, sans-serif" font-size="25">Easy little fixes that make the home feel sweeter fast.</text>
