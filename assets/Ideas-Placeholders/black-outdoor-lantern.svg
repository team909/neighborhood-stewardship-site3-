  <text x="600" y="1014" text-anchor="middle" fill="#947450" font-family="Arial, sans-serif" font-size="29" letter-spacing="6">LOOKS MORE EXPENSIVE THAN IT IS</text>
  <text x="600" y="1086" text-anchor="middle" fill="#223327" font-family="Georgia, serif" font-size="66">Black Outdoor Lantern</text>
